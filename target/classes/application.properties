spring.application.name=retailorderhub

# In-memory H2 database - fine for training purposes.
# DB_CLOSE_DELAY=-1 keeps the in-memory DB alive for the app's lifetime;
# without it, the DB can be torn down between the datasource-init connection
# and Hibernate's own connection, producing "table not found" errors at runtime.
spring.datasource.url=jdbc:h2:mem:retailorderhub;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Run data.sql AFTER Hibernate creates the schema from the entities (Order,
# Product), not before - matches Day 1's configuration.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
